<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
		<script>
			try {
				var t = localStorage.getItem('theme');
				if (t && /^(dark|light|vt320|grid|c64|matrix|crypt)$/.test(t)) {
					document.documentElement.dataset.theme = t;
					document.querySelector('link[rel="icon"]').href = '/favicon-' + t + '.svg';
				}
				if (localStorage.getItem('crt-curve') === '1') {
					document.documentElement.setAttribute('data-crt', '');
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
